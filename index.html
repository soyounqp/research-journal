<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Journal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: "SuperstudioLL-Bold.otf";
    src: url("./fonts/SuperstudioLL-Bold.otf") format("truetype");
  }

  :root {
    --bg: #CCCCCC;
    --text: #111111;
    --muted: #666666;
    --border: #bbbbbb;
    --accent: #111111;
    --hover-bg: #bbbbbb;
    --font-mono: "SuperstudioLL-Bold.otf", monospace;
    --font-sans: "SuperstudioLL-Bold.otf", monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  .layout { display: flex; min-height: 100vh; position: relative; }

  .main-col { flex: 1; min-width: 0; max-width: 100vw; overflow-x: hidden; }

  .resize-handle {
    display: none;
    position: fixed;
    top: 0;
    width: 8px;
    height: 100vh;
    cursor: col-resize;
    z-index: 55;
    background: transparent;
    transform: translateX(50%);
  }
  .resize-handle.visible { display: block; }

  .side-panel {
    width: 0;
    overflow: hidden;
    position: fixed;
    top: 0; right: 0;
    height: 100vh;
    transition: width 0.35s ease;
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  .side-panel.open { width: 50vw; }

  .side-inner {
    width: 50vw;
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px 80px;
    opacity: 0;
    transition: opacity 0.2s ease 0.15s;
    scrollbar-width: none;
  }
  .side-inner::-webkit-scrollbar { display: none; }
  .side-panel.open .side-inner { opacity: 1; }

  .side-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .side-header-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .side-header-right { display: flex; align-items: baseline; }
  .side-header-date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 1.5em; }
  .side-close {
    background: none; border: none;
    font-size: 11px; font-family: var(--font-mono);
    cursor: pointer; color: var(--muted); line-height: 1; padding: 0;
  }
  .side-close:hover { color: var(--text); }

  .side-img-strip { margin-bottom: 20px; }
  .side-img-strip.single { display: flex; justify-content: center; }
  .side-img-strip.single img { width: 50%; height: auto; display: block; }
  .side-img-strip.multi {
    display: flex; justify-content: center; flex-wrap: nowrap;
    overflow-x: auto; gap: 8px;
    margin-left: -28px; margin-right: -28px;
    padding-left: 28px; padding-right: 28px;
    scrollbar-width: none;
  }
  .side-img-strip.multi::-webkit-scrollbar { display: none; }
  .side-img-strip.multi img { flex-shrink: 0; height: 260px; width: auto; display: block; object-fit: contain; }

  .side-text { font-size: 14px; line-height: 1.6; color: #222; white-space: pre-wrap; }
  .side-text .ht { background-color: var(--ht-color, #ffff00); color: inherit; cursor: pointer; padding: 0 1px; }
  .auto-link { color: inherit; text-decoration: underline; text-decoration-style: solid; text-underline-offset: 3px; }
  .auto-link:hover { opacity: 0.7; }
  .dash-item { display: block; padding-left: 1.2em; text-indent: -1.2em; }
  .dash-item::before { content: '— '; }

  .side-footer {
    position: fixed; bottom: 24px; right: 28px;
    display: flex; align-items: center; gap: 16px;
    background: transparent; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease 0.15s; z-index: 60;
  }
  .side-panel.open .side-footer { opacity: 1; pointer-events: auto; }

  .btn-edit, .btn-delete {
    font-family: var(--font-mono); font-size: 11px;
    background: transparent; border: none; cursor: pointer; padding: 0;
    color: var(--muted);
  }
  .btn-edit:hover, .btn-delete:hover { opacity: 0.6; }

  header {
    padding: 14px 24px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .site-title {
    font-family: var(--font-mono); font-size: 14px;
    letter-spacing: 0.08em; text-decoration: none; color: var(--text);
  }

  .live-clock {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 14px; color: blue;
    letter-spacing: 0.08em; z-index: 999; pointer-events: none; white-space: nowrap;
  }

  .header-controls { display: flex; align-items: center; gap: 8px; }

  .new-btn-fixed {
    position: fixed; bottom: 24px; left: 24px; z-index: 200;
    width: 48px; height: 48px; cursor: pointer;
    background: none; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .new-btn-fixed:hover { opacity: 0.75; }

  .tag-panel { overflow: visible; max-height: 0; background: var(--bg); }
  .tag-panel.open { max-height: none; }
  .tag-panel-inner {
    padding: 4px 24px 8px;
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; line-height: 1.2;
  }
  .tag-chip {
    font-family: var(--font-mono); font-size: 15px; padding: 0 3px;
    border: none; background: #ffffff; color: var(--text); cursor: pointer; line-height: 1.2;
  }
  .tag-chip.active { color: var(--text); }

  .upload-panel {
    display: none; background: #bbbbbb;
    border-bottom: 1px solid var(--border); padding: 20px 24px;
  }
  .upload-panel.open { display: block; }
  .upload-panel h3 {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.07em;
    text-transform: uppercase; margin-bottom: 14px; font-weight: normal; color: var(--muted);
  }
  .form-row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
  .form-group label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .form-group input, .form-group textarea {
    font-family: var(--font-sans); font-size: 13px; line-height: 1.6;
    padding: 6px 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); outline: none; resize: vertical;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .live-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; min-height: 16px; }
  .live-tag {
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); padding: 1px 6px;
  }
  .drop-zone {
    border: 1px dashed var(--border); padding: 18px; text-align: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    cursor: pointer; background: var(--bg); margin-bottom: 10px;
  }
  .drop-zone:hover, .drop-zone.over { border-color: var(--accent); color: var(--text); }
  .drop-zone input[type="file"] { display: none; }
  .preview-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-actions { display: flex; gap: 8px; }
  .btn-primary {
    font-family: var(--font-mono); font-size: 12px; padding: 6px 16px;
    background: var(--accent); color: #fff; border: 1px solid var(--accent); cursor: pointer;
  }
  .btn-cancel {
    font-family: var(--font-mono); font-size: 12px; padding: 6px 16px;
    background: transparent; color: var(--muted); border: 1px solid var(--border); cursor: pointer;
  }
  .btn-cancel:hover { color: var(--text); border-color: var(--text); }

  .status-bar {
    padding: 6px 24px;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    min-height: 28px;
  }

  .sub-toolbar { padding: 8px 24px; }
  .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  main { padding: 0 24px 48px; }
  .archive-list { display: none; }
  .archive-list.active { display: block; }

  .list-item {
    display: grid; grid-template-columns: 3em 1fr auto;
    align-items: baseline; gap: 4px; padding: 13px 0; cursor: pointer; color: inherit;
  }
  .list-date { font-family: var(--font-mono); font-size: 15px; color: var(--muted); white-space: nowrap; }
  body.side-open .list-item { grid-template-columns: 3em 1fr; position: relative; }
  body.side-open .list-date { position: absolute; right: -999px; }
  .list-num { font-family: var(--font-mono); font-size: 15px; color: var(--muted); text-align: left; }
  .list-item:hover .list-title, .list-item:hover .list-num, .list-item:hover .list-date,
  .list-item.active .list-title, .list-item.active .list-num, .list-item.active .list-date { color: #ffffff; }
  .list-thumb { display: none; }
  .img-tooltip {
    position: fixed; pointer-events: none; z-index: 300;
    display: none; width: 140px; height: auto;
  }
  .img-tooltip.visible { display: block; }
  .list-title { font-size: 15px; font-weight: normal; margin-bottom: 3px; }
  .empty { padding: 48px 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: center; }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    main { padding: 0 16px 48px; }
    .upload-panel { padding: 16px; }
    .list-item { grid-template-columns: 2em 1fr; }
    .list-date { display: none; }
    .tag-panel-inner { padding: 12px 16px; }
    .side-panel.open { width: 100vw; }
    .side-inner { width: 100vw; }
    .side-footer { width: 100vw; }
  }
</style>
</head>
<body>

<div class="layout">
  <div class="main-col" id="mainCol">
    <header>
      <div class="header-left">
        <a class="site-title" href="#" onclick="goHome(event)">Research Journal</a>
      </div>
      <div class="header-controls"></div>
    </header>

    <div class="tag-panel open" id="tagPanel">
      <div class="tag-panel-inner" id="tagPanelInner"></div>
    </div>

    <div class="upload-panel" id="uploadPanel">
      <h3 id="panelHeading">New Entry</h3>
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label>Title *</label>
          <input type="text" id="inTitle" placeholder="">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="inDate">
        </div>
      </div>
      <div class="form-group" style="margin-bottom:10px">
        <label>Content</label>
        <textarea id="inContent" rows="20" placeholder=""></textarea>
        <div class="live-tags" id="liveTags"></div>
      </div>
      <div class="drop-zone" id="dropZone">
        <label for="fileInput">Drag &amp; drop images here, or click to attach<br>
          <span style="font-size:10px;margin-top:4px;display:block">JPG · PNG · GIF · WEBP</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>
      <div class="preview-strip" id="previewStrip"></div>
      <div class="form-actions">
        <button class="btn-primary" id="saveBtn">Save</button>
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>
    <div class="sub-toolbar"><span class="count" id="countLabel"></span></div>

    <main>
      <div class="archive-list active" id="listView"></div>
      <div class="empty" id="emptyMsg" style="display:none">No entries found.</div>
    </main>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="side-inner">
      <div class="side-header">
        <span class="side-header-num" id="sideHeaderNum"></span>
        <div class="side-header-right">
          <span class="side-header-date" id="sideHeaderDate"></span>
          <button class="side-close" id="sideClose">✕</button>
        </div>
      </div>
      <div class="side-img-strip" id="sideImgStrip"></div>
      <p class="side-text" id="sideText"></p>
    </div>
    <div class="side-footer">
      <button class="btn-edit" id="sideEditBtn">Edit</button>
      <button class="btn-delete" id="sideDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div class="resize-handle" id="resizeHandle"></div>

<button class="new-btn-fixed" id="toggleUpload" title="New Entry">
  <svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <circle cx="24" cy="24" r="23" fill="#111111"/>
    <line x1="24" y1="13" x2="24" y2="35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="13" y1="24" x2="35" y2="24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
</button>

<img class="img-tooltip" id="imgTooltip" src="" alt="">
<span class="live-clock" id="liveClock"></span>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc,
  updateDoc, deleteDoc, orderBy, query, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase ───────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBUub6me02SkIBexEs0jhrPOybNblkQdks",
  authDomain: "research-journal-26.firebaseapp.com",
  projectId: "research-journal-26",
  storageBucket: "research-journal-26.firebasestorage.app",
  messagingSenderId: "399908342344",
  appId: "1:399908342344:web:4626c367cc641db3e0667d"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const COL = "entries";

function setStatus(msg) {
  document.getElementById('statusBar').textContent = msg;
}

// ── Clock ──────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const y = now.getFullYear(), mo = months[now.getMonth()], d = now.getDate();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const mi = String(now.getMinutes()).padStart(2,'0');
  const s  = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('liveClock').textContent = `${y} ${mo} ${d}  ${h}:${mi}:${s} ${ampm}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── Helpers ────────────────────────────────────────────
function extractTags(text) {
  const m = text.match(/#([a-zA-Z0-9_-]+)/g) || [];
  return [...new Set(m.map(t => t.slice(1).toLowerCase()))];
}

function stem(word) {
  word = word.toLowerCase();
  if (word.length < 4) return word;
  const rules = [[/ies$/,'y'],[/ied$/,'y'],[/ness$/,''],[/ing$/,''],[/ed$/,''],[/er$/,''],[/ly$/,''],[/es$/,''],[/s$/,'']];
  for (const [re, rep] of rules) {
    if (re.test(word)) { const s = word.replace(re, rep); if (s.length >= 3) return s; }
  }
  return word;
}

const tagColorCache = {};
function getTagColor(t) {
  if (!tagColorCache[t]) {
    const h = Math.floor(Math.random()*360), s = 80+Math.floor(Math.random()*20), l = 50+Math.floor(Math.random()*15);
    tagColorCache[t] = `hsl(${h},${s}%,${l}%)`;
  }
  return tagColorCache[t];
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function renderContent(text) {
  const tagMatches = text.match(/#([a-zA-Z0-9_-]+)/g) || [];
  const tags = [...new Set(tagMatches.map(t => t.slice(1).toLowerCase()))];
  const stemMap = {};
  tags.forEach(tag => { stemMap[stem(tag)] = tag; });

  let result = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  result = result.replace(/(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener" class="auto-link">$1</a>');
  result = result.split('\n').map(line => /^- /.test(line) ? `<span class="dash-item">${line.slice(2)}</span>` : line).join('\n');
  if (!tags.length) return result;

  result = result.replace(/#([a-zA-Z0-9_-]+)/g, (match, word) => {
    const matchedTag = stemMap[stem(word.toLowerCase())] || word.toLowerCase();
    const col = getTagColor(matchedTag);
    return `<span class="ht" style="background-color:${col}" data-tag="${matchedTag}" onclick="filterByTag('${matchedTag}')">${word}</span>`;
  });
  result = result.replace(/(<[^>]+>)|([A-Za-z]{3,})/g, (match, tag, word) => {
    if (tag) return tag;
    const s2 = stem(word.toLowerCase());
    const matchedTag = stemMap[s2];
    if (matchedTag) {
      const col = getTagColor(matchedTag);
      return `<span class="ht" style="background-color:${col}" data-tag="${matchedTag}" onclick="filterByTag('${matchedTag}')">${word}</span>`;
    }
    return match;
  });
  return result;
}

// ── State ──────────────────────────────────────────────
let items = [];
let activeTag = new Set();
let editingId = null;
let currentModalId = null;
let pendingImages = [];
let sidePanelWidth = 50;
let isResizing = false;
let rafId = null;

// ── Firestore load ─────────────────────────────────────
async function loadItems() {
  setStatus('Loading...');
  try {
    const q = query(collection(db, COL), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    items = snap.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
  } catch(e) {
    try {
      const snap = await getDocs(collection(db, COL));
      items = snap.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
    } catch(e2) {
      setStatus('Failed to load. Check your connection.');
      return;
    }
  }
  setStatus('');
  render();
}

// ── Firestore save ─────────────────────────────────────
async function saveItem(data) {
  if (editingId) {
    const item = items.find(i => i.id === editingId);
    if (item && item.firestoreId) {
      await updateDoc(doc(db, COL, item.firestoreId), data);
      const idx = items.findIndex(i => i.id === editingId);
      if (idx !== -1) items[idx] = { ...items[idx], ...data };
    }
  } else {
    const newData = { ...data, createdAt: Date.now(), id: Date.now().toString() };
    const ref = await addDoc(collection(db, COL), newData);
    items.unshift({ firestoreId: ref.id, ...newData });
  }
}

async function deleteItem(id) {
  const item = items.find(i => i.id === id);
  if (item && item.firestoreId) {
    await deleteDoc(doc(db, COL, item.firestoreId));
  }
  items = items.filter(i => i.id !== id);
}

// ── Render ─────────────────────────────────────────────
function allTags() {
  const count = {};
  items.forEach(it => (it.tags||[]).forEach(t => { count[t] = (count[t]||0)+1; }));
  return Object.entries(count).sort((a,b) => a[0].localeCompare(b[0]));
}

function filtered() {
  return items
    .filter(it => activeTag.size === 0 || (it.tags||[]).some(t => activeTag.has(t)))
    .sort((a,b) => {
      const dd = (b.date||'').localeCompare(a.date||'');
      if (dd !== 0) return dd;
      return (b.createdAt||0) - (a.createdAt||0);
    });
}

function render() {
  renderTagPanel();
  const data = filtered();
  document.getElementById('countLabel').textContent = '';
  const listEl = document.getElementById('listView');
  const emptyEl = document.getElementById('emptyMsg');
  listEl.innerHTML = '';
  if (!data.length) { emptyEl.style.display='block'; return; }
  emptyEl.style.display = 'none';

  const allSorted = [...items].sort((a,b) => {
    const dd = (a.date||'').localeCompare(b.date||'');
    if (dd !== 0) return dd;
    return (a.createdAt||0) - (b.createdAt||0);
  });

  data.forEach(item => {
    const title = item.title || '—';
    const num = allSorted.findIndex(i => i.id === item.id) + 1;
    const src = item.images && item.images[0];
    const li = document.createElement('div');
    li.className = 'list-item';
    li.dataset.id = item.id;
    if (src) li.dataset.img = src;
    li.onclick = () => openSide(item.id);
    li.innerHTML = `
      <div class="list-num">${num}</div>
      <div><div class="list-title">${title}</div></div>
      <div class="list-date">${fmtDate(item.date)}</div>
    `;
    listEl.appendChild(li);
  });
}

function renderTagPanel() {
  const inner = document.getElementById('tagPanelInner');
  inner.innerHTML = '';
  allTags().forEach(([t]) => {
    const chip = document.createElement('button');
    const isActive = activeTag.has(t);
    chip.className = 'tag-chip' + (isActive ? ' active' : '');
    chip.innerHTML = t;
    if (isActive) { chip.style.backgroundColor = getTagColor(t); chip.style.padding = '0 3px'; }
    chip.onclick = () => { if (activeTag.has(t)) activeTag.delete(t); else activeTag.add(t); render(); };
    inner.appendChild(chip);
  });
}

// ── goHome ─────────────────────────────────────────────
window.goHome = function(e) {
  e.preventDefault();
  closeSide();
  activeTag = new Set();
  document.getElementById('uploadPanel').classList.remove('open');
  resetForm();
  render();
  window.scrollTo({ top: 0 });
};

window.filterByTag = function(tag) {
  activeTag = new Set([tag]);
  render();
};

// ── Tooltip ────────────────────────────────────────────
const tooltip = document.getElementById('imgTooltip');
document.getElementById('listView').addEventListener('mousemove', e => {
  const li = e.target.closest('[data-img]');
  if (!li) { tooltip.classList.remove('visible'); return; }
  tooltip.src = li.dataset.img;
  tooltip.classList.add('visible');
  const offset = 16;
  let x = e.clientX + offset, y = e.clientY + offset;
  if (x + 140 > window.innerWidth) x = e.clientX - 140 - offset;
  if (y + 200 > window.innerHeight) y = e.clientY - 200 - offset;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
});
document.getElementById('listView').addEventListener('mouseleave', () => tooltip.classList.remove('visible'));

// ── Upload panel ───────────────────────────────────────
document.getElementById('toggleUpload').onclick = () =>
  document.getElementById('uploadPanel').classList.toggle('open');
document.getElementById('cancelBtn').onclick = closeUpload;

function closeUpload() {
  document.getElementById('uploadPanel').classList.remove('open');
  document.getElementById('panelHeading').textContent = 'New Entry';
  editingId = null;
  resetForm();
}

function resetForm() {
  ['inTitle','inDate','inContent'].forEach(id => document.getElementById(id).value='');
  document.getElementById('liveTags').innerHTML = '';
  document.getElementById('previewStrip').innerHTML = '';
  pendingImages = [];
}

document.getElementById('inContent').addEventListener('input', () => {
  const tags = extractTags(document.getElementById('inContent').value);
  document.getElementById('liveTags').innerHTML = tags.map(t=>`<span class="live-tag">${t}</span>`).join('');
});

// ── Image handling ─────────────────────────────────────
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('over'); };
dropZone.ondragleave = () => dropZone.classList.remove('over');
dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove('over'); handleFiles(e.dataTransfer.files); };
fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ''; };

function compressImage(file, maxPx = 800, quality = 0.7) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => resolve(e.target.result);
      img.onload = () => {
        try {
          let w = img.width, h = img.height;
          if (w > maxPx || h > maxPx) {
            if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
            else { w = Math.round(w * maxPx / h); h = maxPx; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          const isPng = file.type === 'image/png', isGif = file.type === 'image/gif';
          if (isPng || isGif) {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png'));
          } else {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          }
        } catch(err) { resolve(e.target.result); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function handleFiles(files) {
  const validFiles = [...files].filter(f => f.type.startsWith('image/'));
  Promise.all(validFiles.map(f => compressImage(f))).then(results => {
    results.filter(Boolean).forEach((dataURL, i) => pendingImages.push({ name: validFiles[i].name, dataURL }));
    renderPreview();
  });
}

function renderPreview() {
  const strip = document.getElementById('previewStrip');
  if (!pendingImages.length) { strip.innerHTML = ''; return; }
  strip.innerHTML = pendingImages.map((img, i) => `
    <div style="position:relative;display:inline-block">
      <img src="${img.dataURL}" alt="" style="width:60px;height:60px;object-fit:cover;border:1px solid var(--border);display:block">
      <button onclick="removeImageAt(${i})" style="position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#111;color:#fff;border:none;cursor:pointer;font-size:10px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:0">✕</button>
    </div>
  `).join('');
}

window.removeImageAt = function(i) { pendingImages.splice(i, 1); renderPreview(); };

// ── Save ───────────────────────────────────────────────
document.getElementById('saveBtn').onclick = async (e) => {
  e.preventDefault();
  const title = document.getElementById('inTitle').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  const date    = document.getElementById('inDate').value || new Date().toISOString().slice(0,10);
  const content = document.getElementById('inContent').value.trim();
  const tags    = extractTags(content);
  const images  = pendingImages.map(i => i.dataURL);

  setStatus('Saving...');
  try {
    await saveItem({ title, date, content, tags, images });
    setStatus('Saved.');
    setTimeout(() => setStatus(''), 2000);
    editingId = null;
    closeUpload();
    render();
  } catch(err) {
    setStatus('Save failed. ' + err.message);
  }
};

// ── Resize ─────────────────────────────────────────────
function updateSidePanelWidth(vw) {
  vw = Math.max(20, Math.min(80, vw));
  sidePanelWidth = vw;
  const panel = document.getElementById('sidePanel');
  panel.style.width = vw + 'vw';
  panel.querySelector('.side-inner').style.width = vw + 'vw';
  const mc = document.getElementById('mainCol');
  mc.style.width = (100-vw) + 'vw'; mc.style.maxWidth = (100-vw) + 'vw';
  document.getElementById('resizeHandle').style.right = vw + 'vw';
}

const resizeHandle = document.getElementById('resizeHandle');
resizeHandle.addEventListener('mousedown', e => {
  isResizing = true; document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none'; e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => updateSidePanelWidth(((window.innerWidth - e.clientX) / window.innerWidth) * 100));
});
document.addEventListener('mouseup', () => {
  if (!isResizing) return;
  isResizing = false; rafId = null;
  document.body.style.cursor = ''; document.body.style.userSelect = '';
});

// ── Side panel ─────────────────────────────────────────
function openSide(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  currentModalId = id;
  document.querySelectorAll('[data-id]').forEach(el => el.classList.toggle('active', el.dataset.id === id));

  const panel = document.getElementById('sidePanel');
  panel.style.background = '#ffffff'; panel.style.color = '#111111';

  const allSorted = [...items].sort((a,b) => {
    const dd = (a.date||'').localeCompare(b.date||'');
    return dd !== 0 ? dd : (a.createdAt||0) - (b.createdAt||0);
  });
  const num = allSorted.findIndex(i => i.id === id) + 1;

  document.getElementById('sideHeaderNum').innerHTML = `${num}&nbsp;&nbsp;&nbsp;${item.title || '—'}`;
  document.getElementById('sideHeaderDate').textContent = fmtDate(item.date);
  document.getElementById('sideText').innerHTML = renderContent(item.content||'');

  const strip = document.getElementById('sideImgStrip');
  if (item.images && item.images.length) {
    strip.className = `side-img-strip ${item.images.length === 1 ? 'single' : 'multi'}`;
    strip.innerHTML = item.images.map(src => `<img src="${src}" alt="">`).join('');
    strip.style.display = '';
  } else {
    strip.innerHTML = ''; strip.style.display = 'none';
  }

  panel.classList.add('open');
  document.body.classList.add('side-open');
  const mc = document.getElementById('mainCol');
  mc.style.width = (100-sidePanelWidth) + 'vw'; mc.style.maxWidth = (100-sidePanelWidth) + 'vw';
  panel.style.width = sidePanelWidth + 'vw';
  panel.querySelector('.side-inner').style.width = sidePanelWidth + 'vw';
  const rh = document.getElementById('resizeHandle');
  rh.style.right = sidePanelWidth + 'vw'; rh.classList.add('visible');
}

function closeSide() {
  const panel = document.getElementById('sidePanel');
  panel.classList.remove('open'); document.body.classList.remove('side-open');
  panel.style.width = ''; panel.querySelector('.side-inner').style.width = '';
  const mc = document.getElementById('mainCol');
  mc.style.width = ''; mc.style.maxWidth = '';
  document.getElementById('resizeHandle').classList.remove('visible');
  document.querySelectorAll('[data-id]').forEach(el => el.classList.remove('active'));
  currentModalId = null;
}

document.getElementById('sideClose').onclick = closeSide;
document.getElementById('mainCol').addEventListener('click', e => {
  if (!document.getElementById('sidePanel').classList.contains('open')) return;
  if (e.target.closest('.list-item')) return;
  if (e.target.closest('#uploadPanel')) return;
  if (e.target.closest('#toggleUpload')) return;
  closeSide();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSide(); });

document.getElementById('sideEditBtn').onclick = e => {
  e.stopPropagation();
  const item = items.find(i => i.id === currentModalId);
  if (!item) return;
  const id = item.id;
  closeSide();
  editingId = id;
  document.getElementById('inTitle').value   = item.title||'';
  document.getElementById('inDate').value    = item.date||'';
  document.getElementById('inContent').value = item.content||'';
  document.getElementById('liveTags').innerHTML = (item.tags||[]).map(t=>`<span class="live-tag">${t}</span>`).join('');
  pendingImages = (item.images||[]).map((src, i) => ({ name:`img_${i}`, dataURL: src }));
  renderPreview();
  document.getElementById('panelHeading').textContent = 'Edit Entry';
  document.getElementById('uploadPanel').classList.add('open');
  window.scrollTo({top:0});
};

document.getElementById('sideDeleteBtn').onclick = async () => {
  if (!confirm('Delete this entry?')) return;
  setStatus('Deleting...');
  try {
    await deleteItem(currentModalId);
    setStatus('Deleted.');
    setTimeout(() => setStatus(''), 2000);
    closeSide(); render();
  } catch(err) { setStatus('Delete failed.'); }
};

// ── Init ───────────────────────────────────────────────
loadItems();
</script>
